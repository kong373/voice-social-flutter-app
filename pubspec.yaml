name: voice_social_app
description: Clean-room Flutter client for a Chinese voice social product.
publish_to: "none"
version: 0.6.0+6

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  agora_rtc_engine: 6.6.3
  crypto: 3.0.7
  image_picker: 1.2.3
  path_provider: 2.1.6
  record: 7.1.1
  just_audio: 0.10.6
  video_player: 2.14.0
  first_party_native_permissions:
    path: packages/first_party_native_permissions
  first_party_room_audio:
    path: packages/first_party_room_audio
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  alipay_app_pay:
    path: packages/alipay_app_pay
  tencent_cloud_chat_sdk: ^9.0.7652+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

# agora_rtc_engine 6.6.3 still declares the older ffi constraint. The SDK's
# generated bindings are compatible with ffi 2.x, which is also required by
# flutter_secure_storage on the supported desktop test host.
dependency_overrides:
  ffi: 2.2.0

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/runtime/
