name: voice_social_app
description: Clean-room Flutter client for a Chinese voice social product.
publish_to: "none"
version: 0.6.0+6

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  crypto: 3.0.7
  first_party_native_permissions:
    path: packages/first_party_native_permissions
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/runtime/
