name: iOS Phase 1 Reconcile

on:
  push:
    branches: [codex/m5-ios-client]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-phase1-reconcile
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.44.7"
  REQUIRED_BASE_SHA: "6b6e35fc03c08431b2c2d6b0147daccd8307c5b9"

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/m5-ios-client
          fetch-depth: 0

      - name: Verify immutable base and file ownership
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$REQUIRED_BASE_SHA" HEAD
          if git diff --name-only "$REQUIRED_BASE_SHA" HEAD | grep -E '^(android/|packages/.+/android/)'; then
            echo 'Android change detected on the iOS branch.' >&2
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Materialize and patch the iOS Runner
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f ios/Runner.xcodeproj/project.pbxproj ]]; then
            generated="$(mktemp -d)"
            trap 'rm -rf "$generated"' EXIT
            flutter create --platforms=ios --org=com.kong373 \
              --project-name=voice_social_app --no-pub \
              "$generated/voice_social_app"
            rm -rf ios
            cp -R "$generated/voice_social_app/ios" ios
          fi

          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re

          root = Path('.')
          ignore_path = root / '.gitignore'
          ignore = ignore_path.read_text(encoding='utf-8')
          ignore_path.write_text(re.sub(r'(?m)^ios/\n', '', ignore), encoding='utf-8')

          podfile = root / 'ios/Podfile'
          pod = podfile.read_text(encoding='utf-8')
          pod = re.sub(
              r'(?m)^#?\s*platform\s+:ios,\s*[\'\"][^\'\"]+[\'\"]\s*$',
              "platform :ios, '13.0'",
              pod,
              count=1,
          )
          if "platform :ios, '13.0'" not in pod:
              pod = "platform :ios, '13.0'\n\n" + pod
          marker = '    flutter_additional_ios_build_settings(target)\n'
          if "config.build_settings['IPHONEOS_DEPLOYMENT_TARGET']" not in pod:
              pod = pod.replace(
                  marker,
                  marker
                  + "    target.build_configurations.each do |config|\n"
                  + "      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'\n"
                  + "    end\n",
              )
          podfile.write_text(pod, encoding='utf-8')

          project_path = root / 'ios/Runner.xcodeproj/project.pbxproj'
          project = project_path.read_text(encoding='utf-8')
          project = re.sub(
              r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;',
              'PRODUCT_BUNDLE_IDENTIFIER = com.kong373.voiceSocialApp;',
              project,
          )
          project = re.sub(
              r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 13.0;',
              project,
          )
          project = re.sub(r'(?m)^\s*DEVELOPMENT_TEAM = .*;\n', '', project)
          if 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;' not in project:
              project = project.replace(
                  'INFOPLIST_FILE = Runner/Info.plist;',
                  'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;\n'
                  '\t\t\t\tINFOPLIST_FILE = Runner/Info.plist;',
              )
          project_path.write_text(project, encoding='utf-8')

          info_path = root / 'ios/Runner/Info.plist'
          with info_path.open('rb') as fh:
              info = plistlib.load(fh)
          info.update({
              'CFBundleDisplayName': 'Voice-Social',
              'CFBundleName': 'Voice-Social',
              'NSMicrophoneUsageDescription':
                  'Voice-Social 需要使用麦克风，以便你在语音房上麦和交流。',
              'NSPhotoLibraryUsageDescription':
                  'Voice-Social 需要访问照片，以便你选择头像、动态图片和举报或反馈凭证。',
              'NSCameraUsageDescription':
                  'Voice-Social 需要使用相机，以便你拍摄头像、动态图片和举报或反馈凭证。',
              'VoiceSocialNotificationPermissionPurpose':
                  'Voice-Social 会在你允许后发送消息、互动和房间状态通知。',
              'UISupportedInterfaceOrientations': ['UIInterfaceOrientationPortrait'],
              'UISupportedInterfaceOrientations~ipad': [
                  'UIInterfaceOrientationPortrait',
                  'UIInterfaceOrientationPortraitUpsideDown',
              ],
          })
          info.pop('CFBundleURLTypes', None)
          info.pop('NSAppTransportSecurity', None)
          with info_path.open('wb') as fh:
              plistlib.dump(info, fh, sort_keys=False)

          (root / 'ios/Runner/Runner.entitlements').write_text(
              '<?xml version="1.0" encoding="UTF-8"?>\n'
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" '
              '"http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
              '<plist version="1.0">\n<dict>\n</dict>\n</plist>\n',
              encoding='utf-8',
          )

          docs = root / 'docs/ios'
          docs.mkdir(parents=True, exist_ok=True)
          (docs / 'phase1-runner.md').write_text(
              """# Voice-Social iOS Phase 1 Runner

## Implemented in source

- Flutter 3.44.7 UIScene-based iOS Runner.
- iOS 13.0 deployment target in Xcode and CocoaPods.
- GeneratedPluginRegistrant registration for first-party permissions, Agora RTC, Tencent IM and secure storage.
- Product-specific microphone, photo-library and camera purpose text.
- App-owned notification rationale. iOS has no standard notification usage-description plist key; UNUserNotificationCenter remains authoritative.
- Empty entitlements: APNs and Universal Links are intentionally absent.
- Android-only Alipay remains unsupported/fail-closed on iOS; Apple IAP is not fabricated.

## Unregistered development placeholder

`com.kong373.voiceSocialApp` is an unregistered development placeholder. No Apple Team ID, registered Bundle ID or provisioning profile is committed or claimed.

## Pending physical-device acceptance

- Confirm a registered Bundle ID and Apple Team.
- Provision and sign a physical-device build.
- Validate microphone, photos, camera and notification flows.
- Validate Agora audio lifecycle and Tencent IM login/C2C/AVChatRoom on physical iPhones.
- Decide APNs scope before adding `aps-environment`.
- Provide an approved Associated Domains/AASA contract before Universal Links.

## Explicit exemptions

- Chuanglan delivery receipts: **EXEMPT**, not completed.
- Alipay asynchronous callback: **EXEMPT**, not completed.
- Alipay refund: **EXEMPT**, not completed.
""",
              encoding='utf-8',
          )
          PY

          cat > test/ios_phase1_runner_contract_test.dart <<'DART'
          import 'dart:io';

          import 'package:flutter_test/flutter_test.dart';

          void main() {
            String read(String path) => File(path).readAsStringSync();

            test('complete iOS 13 Runner is tracked', () {
              const paths = <String>[
                'ios/Podfile',
                'ios/Flutter/AppFrameworkInfo.plist',
                'ios/Flutter/Debug.xcconfig',
                'ios/Flutter/Release.xcconfig',
                'ios/Runner.xcodeproj/project.pbxproj',
                'ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme',
                'ios/Runner.xcworkspace/contents.xcworkspacedata',
                'ios/Runner/AppDelegate.swift',
                'ios/Runner/SceneDelegate.swift',
                'ios/Runner/Info.plist',
                'ios/Runner/Runner.entitlements',
                'ios/Runner/Base.lproj/Main.storyboard',
                'ios/Runner/Base.lproj/LaunchScreen.storyboard',
                'ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json',
                'ios/RunnerTests/RunnerTests.swift',
              ];
              for (final path in paths) {
                expect(File(path).existsSync(), isTrue, reason: path);
              }
              expect(read('ios/Podfile'), contains("platform :ios, '13.0'"));
              expect(
                read('ios/Runner.xcodeproj/project.pbxproj'),
                contains('IPHONEOS_DEPLOYMENT_TARGET = 13.0;'),
              );
            });

            test('identity, purposes and capabilities fail closed', () {
              final project = read('ios/Runner.xcodeproj/project.pbxproj');
              final info = read('ios/Runner/Info.plist');
              final entitlements = read('ios/Runner/Runner.entitlements');
              final alipay = read('packages/alipay_app_pay/pubspec.yaml');
              expect(project, contains('com.kong373.voiceSocialApp'));
              expect(project, isNot(contains('DEVELOPMENT_TEAM =')));
              expect(info, contains('NSMicrophoneUsageDescription'));
              expect(info, contains('语音房上麦和交流'));
              expect(info, contains('NSPhotoLibraryUsageDescription'));
              expect(info, contains('选择头像、动态图片和举报或反馈凭证'));
              expect(info, contains('NSCameraUsageDescription'));
              expect(info, contains('拍摄头像、动态图片和举报或反馈凭证'));
              expect(info, contains('VoiceSocialNotificationPermissionPurpose'));
              expect(info, contains('消息、互动和房间状态通知'));
              expect(entitlements, isNot(contains('aps-environment')));
              expect(
                entitlements,
                isNot(contains('com.apple.developer.associated-domains')),
              );
              expect(info, isNot(contains('CFBundleURLTypes')));
              expect(info, isNot(contains('NSAllowsArbitraryLoads')));
              expect(alipay, contains('android:'));
              expect(alipay, isNot(contains(RegExp(r'^\s+ios:', multiLine: true))));
              expect(Directory('packages/alipay_app_pay/ios').existsSync(), isFalse);
              expect(read('pubspec.yaml'), isNot(contains('in_app_purchase')));
            });

            test('existing iOS plugins use standard registrant and pods', () {
              expect(
                read('ios/Runner/AppDelegate.swift'),
                contains('GeneratedPluginRegistrant.register'),
              );
              expect(read('ios/Podfile'), contains('flutter_install_all_ios_pods'));
            });
          }
          DART
          dart format test/ios_phase1_runner_contract_test.dart

          rm -f .github/workflows/ios-phase1-bootstrap.yml
          rm -f .github/workflows/ios-phase1-finalize.yml
          rm -f .github/workflows/ios-phase1-reconcile.yml

      - name: Commit source boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Voice Social iOS Automation'
          git config user.email 'ios-automation@users.noreply.github.com'
          git add -A -- .gitignore ios docs/ios \
            test/ios_phase1_runner_contract_test.dart .github/workflows
          if git diff --cached --name-only | grep -E '^(android/|packages/.+/android/)'; then
            echo 'Refusing to commit Android paths.' >&2
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat(ios): add iOS 13 Runner and fail-closed vendor host'
            git push origin HEAD:codex/m5-ios-client
          fi
          mkdir -p build/ios-phase1-evidence
          git rev-parse HEAD > build/ios-phase1-evidence/source-sha.txt

      - name: Verify Dart, Pods and simulator build
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p build/ios-phase1-evidence
          flutter --version > build/ios-phase1-evidence/flutter-version.txt 2>&1
          xcodebuild -version > build/ios-phase1-evidence/xcode-version.txt 2>&1
          pod --version > build/ios-phase1-evidence/cocoapods-version.txt 2>&1

          flutter pub get --enforce-lockfile > build/ios-phase1-evidence/pub-get.log 2>&1; pub=$?
          if [[ "$pub" -eq 0 ]]; then
            (cd ios && pod install) > build/ios-phase1-evidence/pod-install.log 2>&1; pods=$?
          else
            pods=125
          fi
          flutter test test/ios_phase1_runner_contract_test.dart --reporter=expanded \
            > build/ios-phase1-evidence/contract-test.log 2>&1; contract=$?
          dart format --output=none --set-exit-if-changed test/ios_phase1_runner_contract_test.dart \
            > build/ios-phase1-evidence/format.log 2>&1; format=$?
          flutter analyze > build/ios-phase1-evidence/analyze.log 2>&1; analyze=$?
          flutter test --concurrency=1 --timeout=90s --reporter=expanded \
            > build/ios-phase1-evidence/flutter-tests.log 2>&1; tests=$?
          flutter build ios --simulator --debug \
            --dart-define=BACKEND_MODE=live \
            --dart-define=APP_ENV=development \
            --dart-define=ALLOW_INSECURE_HTTP=true \
            --dart-define=API_BASE_URL=http://127.0.0.1:18080/ \
            --dart-define=CLIENT_TYPE=iOS \
            --dart-define=CLIENT_INNER_VERSION=6 \
            --dart-define=OAUTH_CLIENT_ID=voice-social-mobile-public \
            --dart-define=ENABLE_AGORA_RTC=false \
            --dart-define=ENABLE_TENCENT_IM=false \
            --dart-define=ENABLE_ALIPAY_APP_PAY=false \
            > build/ios-phase1-evidence/ios-simulator-build.log 2>&1; build=$?

          scope=0
          git diff --name-only "$REQUIRED_BASE_SHA" HEAD | grep -E '^(android/|packages/.+/android/)' && scope=1
          grep -RInaE --exclude='Podfile.lock' \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|OAUTH_CLIENT_SECRET|Client-Secret|UserSigPrivateKey|AGORA_APP_CERTIFICATE' ios && scope=1
          grep -RInE 'aps-environment|com\.apple\.developer\.associated-domains' ios/Runner && scope=1

          overall=0
          for code in "$pub" "$pods" "$contract" "$format" "$analyze" "$tests" "$build" "$scope"; do
            [[ "$code" -eq 0 ]] || overall=1
          done
          cat > build/ios-phase1-evidence/status.env <<EOF
          pub=$pub
          pods=$pods
          contract=$contract
          format=$format
          analyze=$analyze
          tests=$tests
          build=$build
          scope=$scope
          overall=$overall
          EOF
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist verification result
        shell: bash
        run: |
          set -Eeuo pipefail
          source build/ios-phase1-evidence/status.env
          verdict=PASS; [[ "$overall" -eq 0 ]] || verdict=BLOCKED
          source_sha="$(git rev-parse HEAD)"
          cat > docs/ios/phase1-status.json <<EOF
          {
            "status": "$verdict",
            "base_sha": "$REQUIRED_BASE_SHA",
            "source_sha": "$source_sha",
            "workflow_run_id": "${{ github.run_id }}",
            "flutter_pub_get_exit": $pub,
            "pod_install_exit": $pods,
            "ios_contract_test_exit": $contract,
            "format_exit": $format,
            "analyze_exit": $analyze,
            "flutter_tests_exit": $tests,
            "ios_simulator_build_exit": $build,
            "scope_and_secret_gate_exit": $scope,
            "physical_device_verified": false,
            "release_signing_verified": false,
            "bundle_id": "com.kong373.voiceSocialApp",
            "bundle_id_status": "UNREGISTERED_DEVELOPMENT_PLACEHOLDER",
            "apns": "NOT_CONFIGURED",
            "universal_links": "NOT_CONFIGURED",
            "alipay_ios": "UNSUPPORTED_FAIL_CLOSED",
            "apple_iap": "NOT_IMPLEMENTED",
            "chuanglan_delivery_receipt": "EXEMPT_NOT_COMPLETED",
            "alipay_async_callback": "EXEMPT_NOT_COMPLETED",
            "alipay_refund": "EXEMPT_NOT_COMPLETED"
          }
          EOF
          git add -A -- ios/Podfile.lock docs/ios/phase1-status.json
          git commit -m "test(ios): record Phase 1 $verdict evidence"
          git push origin HEAD:codex/m5-ios-client
          git rev-parse HEAD > build/ios-phase1-evidence/final-sha.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-phase1-reconcile-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ios-phase1-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce green result
        shell: bash
        run: test "${{ steps.verify.outputs.overall }}" = "0"
