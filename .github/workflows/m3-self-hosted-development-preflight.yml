name: M3 self-hosted development preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-self-hosted-development-preflight
  cancel-in-progress: false

jobs:
  development-preflight:
    name: Read-only development gateway preflight
    runs-on: [self-hosted, macOS, ARM64, m3-dev]
    environment: development
    timeout-minutes: 35
    env:
      TESTED_GIT_SHA: f323b9abc1e0f77a1972b34e9190563681168b97
      M3_API_BASE_URL: ${{ secrets.M3_API_BASE_URL }}
      M3_OAUTH_CLIENT_ID: ${{ secrets.M3_OAUTH_CLIENT_ID }}
      M3_OAUTH_CLIENT_SECRET: ${{ secrets.M3_OAUTH_CLIENT_SECRET }}
      M3_CLIENT_TYPE: Android
      M3_CLIENT_INNER_VERSION: "1"
      M3_APP_ENV: development
      M3_API_TIMEOUT_SECONDS: "15"
      M3_PROBE_PATH: /health
      M3_ALLOW_INSECURE_HTTP: "true"
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: Prepare isolated evidence directory
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="$RUNNER_TEMP/m3-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$evidence_dir"
          mkdir -m 700 "$evidence_dir"
          echo "EVIDENCE_DIR=$evidence_dir" >> "$GITHUB_ENV"

      - name: Checkout reviewed candidate
        uses: actions/checkout@v4
        with:
          ref: f323b9abc1e0f77a1972b34e9190563681168b97
          persist-credentials: false

      - name: Verify immutable checkout and runner constraints
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_GIT_SHA"
          test "$RUNNER_OS" = "macOS"
          test "$RUNNER_ARCH" = "ARM64"
          test "${{ runner.environment }}" = "self-hosted"
          printf 'tested_git_sha=%s\n' "$TESTED_GIT_SHA" > "$EVIDENCE_DIR/tested-git-sha.txt"
          printf 'runner_os=%s\nrunner_arch=%s\nrunner_label=m3-dev\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" > "$EVIDENCE_DIR/runner-redacted.txt"

      - name: Resolve pinned local Flutter 3.44.7
        shell: bash
        run: |
          set -Eeuo pipefail

          candidates=()
          if command -v flutter >/dev/null 2>&1; then
            candidates+=("$(command -v flutter)")
          fi
          candidates+=(
            "$HOME/fvm/versions/3.44.7/bin/flutter"
            "$HOME/.fvm/versions/3.44.7/bin/flutter"
            "$HOME/.local/share/fvm/versions/3.44.7/bin/flutter"
            "$HOME/Documents/ny/voice-social-flutter-app/.fvm/flutter_sdk/bin/flutter"
            "$HOME/Documents/ny/voice-social-flutter-app/.fvm/versions/3.44.7/bin/flutter"
            "/opt/homebrew/bin/flutter"
            "/usr/local/bin/flutter"
          )

          flutter_bin=''
          for candidate in "${candidates[@]}"; do
            if [[ ! -x "$candidate" ]]; then
              continue
            fi
            version="$("$candidate" --version --machine 2>/dev/null | jq -r '.frameworkVersion // empty' || true)"
            if [[ "$version" == '3.44.7' ]]; then
              flutter_bin="$candidate"
              break
            fi
          done

          if [[ -z "$flutter_bin" ]]; then
            while IFS= read -r candidate; do
              if [[ ! -x "$candidate" ]]; then
                continue
              fi
              version="$("$candidate" --version --machine 2>/dev/null | jq -r '.frameworkVersion // empty' || true)"
              if [[ "$version" == '3.44.7' ]]; then
                flutter_bin="$candidate"
                break
              fi
            done < <(
              find \
                "$HOME/fvm" \
                "$HOME/.fvm" \
                "$HOME/.local/share/fvm" \
                "$HOME/Documents/ny" \
                -maxdepth 8 \
                -path '*/3.44.7/bin/flutter' \
                -print 2>/dev/null | sort -u
            )
          fi

          if [[ -z "$flutter_bin" ]]; then
            echo 'Flutter 3.44.7 is not installed in an approved local path on the self-hosted runner.' >&2
            exit 1
          fi

          flutter_root="$(cd "$(dirname "$flutter_bin")/.." && pwd)"
          test -x "$flutter_root/bin/flutter"
          test -x "$flutter_root/bin/dart"
          test "$("$flutter_root/bin/flutter" --version --machine | jq -r '.frameworkVersion')" = '3.44.7'

          printf 'FLUTTER_ROOT=%s\n' "$flutter_root" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$flutter_root" >> "$GITHUB_PATH"
          printf 'flutter_version=3.44.7\nflutter_source=preinstalled-local-sdk\n' \
            > "$EVIDENCE_DIR/flutter-runtime.txt"

      - name: Verify local backend health
        shell: bash
        run: |
          set -Eeuo pipefail
          http_status="$(curl --silent --show-error \
            --output "$EVIDENCE_DIR/backend-health.json" \
            --write-out '%{http_code}' \
            --max-time 10 \
            "$M3_API_BASE_URL/health")"
          test "$http_status" = "200"
          jq -e '.code == 200 and .data.status == "UP" and .data.environment == "development"' \
            "$EVIDENCE_DIR/backend-health.json" >/dev/null
          printf 'backend_http_status=%s\n' "$http_status" > "$EVIDENCE_DIR/backend-status.txt"

      - name: Resolve locked Flutter dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter pub get --enforce-lockfile

      - name: Run side-effect-free redacted preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          dart run tool/m3_live_preflight.dart > "$EVIDENCE_DIR/flutter-preflight-redacted.json"
          jq -e '.status == "gatewayReachable" and .httpStatus == 200 and .canAttemptAuthentication == true' \
            "$EVIDENCE_DIR/flutter-preflight-redacted.json" >/dev/null
          jq '{status, httpStatus, latencyMs, canAttemptAuthentication}' \
            "$EVIDENCE_DIR/flutter-preflight-redacted.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted evidence only
        uses: actions/upload-artifact@v4
        with:
          name: m3-self-hosted-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Clean runner temporary evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -n "${EVIDENCE_DIR:-}" && "$EVIDENCE_DIR" == "$RUNNER_TEMP"/m3-preflight-* ]]; then
            rm -rf "$EVIDENCE_DIR"
          fi
