name: M5 iOS client

on:
  push:
    branches:
      - main
      - codex/m5-ios-client
      - codex/m5-ios-client-reviewed
      - codex/m5-unified-release-candidate
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-ios-client-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"
  IOS_BASE_SHA: "6b6e35fc03c08431b2c2d6b0147daccd8307c5b9"

jobs:
  quality:
    name: iOS source contracts and Flutter quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Enforce iOS-only branch scope
        if: >-
          github.ref_name == 'codex/m5-ios-client' ||
          github.ref_name == 'codex/m5-ios-client-reviewed' ||
          github.head_ref == 'codex/m5-ios-client' ||
          github.head_ref == 'codex/m5-ios-client-reviewed'
        shell: bash
        run: |
          set -Eeuo pipefail
          git cat-file -e "${IOS_BASE_SHA}^{commit}"
          changed="$(git diff --name-only "${IOS_BASE_SHA}"...HEAD)"
          printf '%s\n' "$changed" | tee ios-changed-files.txt
          if printf '%s\n' "$changed" | grep -E \
            '^(android/|packages/[^/]+/android/|lib/features/.*/android/|tool/prepare_android_)'; then
            echo 'The iOS branch modified an Android-owned path.' >&2
            exit 1
          fi

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java 21 for inherited Android helper contracts
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Canonicalize inherited Android toolchain paths
        shell: bash
        run: |
          set -Eeuo pipefail
          canonical_java_home="$(cd "$JAVA_HOME" && pwd -P)"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          canonical_sdk_root="$(cd "$sdk_root" && pwd -P)"
          test -x "$canonical_java_home/bin/java"
          test -x "$canonical_java_home/bin/javac"
          test -x "$canonical_java_home/bin/jar"
          test ! -L "$canonical_java_home"
          test ! -L "$canonical_sdk_root"
          {
            echo "JAVA_HOME=$canonical_java_home"
            echo "ANDROID_HOME=$canonical_sdk_root"
            echo "ANDROID_SDK_ROOT=$canonical_sdk_root"
          } >> "$GITHUB_ENV"

      - name: Generate isolated Android wrapper for inherited helper contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -d android ]]; then
            git ls-files --error-unmatch android/gradlew >/dev/null
          else
            test ! -e android
            host_dir="${RUNNER_TEMP}/voice-social-android-host"
            test ! -e "$host_dir"
            flutter create \
              --platforms=android \
              --org=com.kong373 \
              --project-name=voice_social_app \
              --no-pub \
              "$host_dir"
            mv "$host_dir/android" android
          fi
          test -x android/gradlew

      - name: Verify locked dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter pub get --enforce-lockfile

      - name: Check iOS Dart contract formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          dart format \
            --output=none \
            --set-exit-if-changed \
            test/ios_host_contract_test.dart

      - name: Analyze
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter analyze 2>&1 | tee ios-analyze.log

      - name: Run all Flutter tests
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter test \
            --coverage \
            --concurrency=1 \
            --timeout=60s \
            --reporter=expanded \
            2>&1 | tee ios-flutter-test.log

      - name: Verify Apple capability and secret hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          if grep -RInE \
            --include='*.swift' \
            --include='*.h' \
            --include='*.m' \
            --include='*.plist' \
            --include='*.entitlements' \
            --include='*.xcconfig' \
            --include='*.pbxproj' \
            --include='Podfile' \
            --include='*.md' \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|DEVELOPMENT_TEAM[[:space:]]*=' \
            ios docs/ios; then
            echo 'Private-key material or an Apple Team ID was committed.' >&2
            exit 1
          fi
          if grep -RInE \
            --include='*.plist' \
            --include='*.entitlements' \
            '<key>(aps-environment|com\.apple\.developer\.associated-domains|com\.apple\.security\.application-groups)</key>' \
            ios/Runner; then
            echo 'An unapproved Apple entitlement was enabled.' >&2
            exit 1
          fi
          if grep -InE \
            '<key>(CFBundleURLTypes|NSAllowsArbitraryLoads)</key>' \
            ios/Runner/Info.plist; then
            echo 'An unapproved URL scheme or global ATS bypass was enabled.' >&2
            exit 1
          fi
          grep -Fq 'ALIPAY_IOS=UNSUPPORTED_FAIL_CLOSED' \
            docs/ios/phase1-ios-host.md
          echo 'ios_capability_and_secret_hygiene=PASS'

      - name: Upload source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m5-ios-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ios-changed-files.txt
            ios-analyze.log
            ios-flutter-test.log
            coverage/
          if-no-files-found: warn
          retention-days: 14

  ios-simulator-build:
    name: CocoaPods and unsigned iOS simulator build
    needs: quality
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Record non-sensitive toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            flutter --version
            xcodebuild -version
            sw_vers
          } | tee ios-toolchain.txt

      - name: Resolve Flutter packages
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter pub get --enforce-lockfile

      - name: Prepare iOS engine artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter precache --ios

      - name: Validate iOS source files
        shell: bash
        run: |
          set -Eeuo pipefail
          ruby -c ios/Podfile
          find ios -type f \( -name '*.plist' -o -name '*.entitlements' \) \
            -print0 | xargs -0 -n1 plutil -lint
          xmllint --noout ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          xmllint --noout ios/Runner/Base.lproj/Main.storyboard
          xmllint --noout ios/Runner/Base.lproj/LaunchScreen.storyboard
          xmllint --noout ios/Runner.xcworkspace/contents.xcworkspacedata
          xcodebuild -list -project ios/Runner.xcodeproj | tee ios-xcode-project-list.txt

      - name: Install CocoaPods
        working-directory: ios
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly COCOAPODS_VERSION='1.16.2'
          cocoapods_bin="$(ruby -r rubygems -e 'print Gem.user_dir')/bin/pod"
          if [[ ! -x "$cocoapods_bin" ]] || \
             [[ "$("$cocoapods_bin" "_${COCOAPODS_VERSION}_" --version 2>/dev/null || true)" \
               != "$COCOAPODS_VERSION" ]]; then
            gem install --user-install cocoapods --version \
              "$COCOAPODS_VERSION" --no-document
          fi
          test -x "$cocoapods_bin"
          test "$("$cocoapods_bin" "_${COCOAPODS_VERSION}_" --version)" = \
            "$COCOAPODS_VERSION"
          cocoapods_wrapper_dir="${RUNNER_TEMP}/voice-social-cocoapods-bin"
          test ! -e "$cocoapods_wrapper_dir"
          install -d -m 700 "$cocoapods_wrapper_dir"
          cat > "$cocoapods_wrapper_dir/pod" <<EOF
          #!/bin/bash
          set -Eeuo pipefail
          exec "$cocoapods_bin" "_${COCOAPODS_VERSION}_" "\$@"
          EOF
          chmod 700 "$cocoapods_wrapper_dir/pod"
          test "$("$cocoapods_wrapper_dir/pod" --version)" = \
            "$COCOAPODS_VERSION"
          printf 'CocoaPods %s\n' "$COCOAPODS_VERSION" >> ../ios-toolchain.txt
          expected_lock="${RUNNER_TEMP}/voice-social-Podfile.lock.expected"
          cp Podfile.lock "$expected_lock"
          echo "$cocoapods_wrapper_dir" >> "$GITHUB_PATH"
          "$cocoapods_wrapper_dir/pod" install --no-repo-update \
            2>&1 | tee ../ios-pod-install.log
          python3 ../tool/qa/verify_ios_pod_lock.py \
            "$expected_lock" Podfile.lock | tee ../ios-pod-lock-portability.txt

      - name: Verify locked native dependency graph
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s ios/Podfile.lock
          grep -Fq 'agora_rtc_engine' ios/Podfile.lock
          grep -Fq 'flutter_secure_storage_darwin' ios/Podfile.lock
          grep -Fq 'first_party_native_permissions' ios/Podfile.lock
          grep -Fq 'tencent_cloud_chat_sdk' ios/Podfile.lock
          test -s ios/Pods/Manifest.lock
          cmp -s ios/Podfile.lock ios/Pods/Manifest.lock
          git diff --exit-code -- \
            ios/Runner.xcodeproj/project.pbxproj \
            ios/Runner.xcworkspace/contents.xcworkspacedata

      - name: Inspect resolved iOS plugin registration
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f ios/Runner/GeneratedPluginRegistrant.m
          grep -Fq 'FirstPartyNativePermissionsPlugin' \
            ios/Runner/GeneratedPluginRegistrant.m
          grep -Eiq 'Agora|RtcEngine' ios/Runner/GeneratedPluginRegistrant.m
          grep -Eiq 'Tencent|TUIKit|ImSdk|CloudChat' \
            ios/Runner/GeneratedPluginRegistrant.m

      - name: Build unsigned iOS simulator app
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(pod --version)" = '1.16.2'
          flutter build ios \
            --simulator \
            --debug \
            --dart-define=BACKEND_MODE=live \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL=http://127.0.0.1:8765/ \
            --dart-define=ALLOW_INSECURE_HTTP=true \
            --dart-define=CLIENT_TYPE=iOS \
            --dart-define=CLIENT_INNER_VERSION=6 \
            --dart-define=OAUTH_CLIENT_ID=voice-social-mobile-public \
            --dart-define=ENABLE_AGORA_RTC=true \
            --dart-define=ENABLE_TENCENT_IM=true \
            --dart-define=ENABLE_ALIPAY_APP_PAY=false \
            2>&1 | tee ios-simulator-build.log
          test -d build/ios/iphonesimulator/Runner.app
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            build/ios/iphonesimulator/Runner.app/Info.plist)"
          test "$bundle_id" = 'com.kong373.voiceSocialApp'
          cp "${RUNNER_TEMP}/voice-social-Podfile.lock.expected" \
            ios/Podfile.lock
          git diff --exit-code -- \
            pubspec.yaml \
            ios/Flutter/AppFrameworkInfo.plist \
            ios/Runner.xcodeproj/project.pbxproj \
            ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme \
            ios/Runner.xcworkspace/contents.xcworkspacedata \
            ios/Podfile.lock

      - name: Inspect simulator app boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          app='build/ios/iphonesimulator/Runner.app'
          if grep -aRIlE \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Client-Secret|OAUTH_CLIENT_SECRET' \
            "$app"; then
            echo 'A confidential credential marker was found in the iOS app.' >&2
            exit 1
          fi
          if find "$app" \( -iname '*Alipay*' -o -iname '*AlipaySDK*' \) \
            -print -quit | grep -q .; then
            echo 'Android-only Alipay artifacts were bundled into the iOS app.' >&2
            exit 1
          fi
          shasum -a 256 "$app/Runner" | tee ios-runner-binary.sha256

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m5-ios-simulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ios-toolchain.txt
            ios-pod-install.log
            ios-pod-lock-portability.txt
            ios-simulator-build.log
            ios-runner-binary.sha256
            ios-xcode-project-list.txt
          if-no-files-found: warn
          retention-days: 14
