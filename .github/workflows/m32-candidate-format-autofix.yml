name: M3.2 one-shot candidate hygiene autofix

on:
  push:
    branches:
      - feat/m3-2a-live-auth-readonly
    paths:
      - tool/review/format_candidate.sh

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/m3-2a-live-auth-readonly
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Apply canonical formatting and hygiene corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tool/review/format_candidate.sh
          bash -n tool/qa/run_m32_vendor_avd.sh

      - name: Commit corrected candidate files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.dart' \
            .github/workflows/flutter-ci.yml \
            tool/qa/run_m32_vendor_avd.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(m3.2a): remove static secret-like QA markers"
          git push origin HEAD:feat/m3-2a-live-auth-readonly
