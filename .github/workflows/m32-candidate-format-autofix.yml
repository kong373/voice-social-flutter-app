name: M3.2 one-shot candidate format autofix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m32-candidate-format-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.ref == 'refs/heads/feat/m3-2a-live-auth-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/m3-2a-live-auth-readonly
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Format candidate Dart files
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tool/review/format_candidate.sh

      - name: Commit formatting only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.dart'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format M3.2 review candidate"
          git push origin HEAD:feat/m3-2a-live-auth-readonly
