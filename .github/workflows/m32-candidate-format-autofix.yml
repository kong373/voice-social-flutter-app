name: M3.2 one-shot candidate format autofix

on:
  push:
    branches:
      - feat/m3-2a-live-auth-readonly
    paths:
      - tool/review/format_candidate.sh

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/m3-2a-live-auth-readonly
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Format candidate Dart files
        shell: bash
        run: |
          set -Eeuo pipefail
          bash tool/review/format_candidate.sh

      - name: Commit formatting only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- '*.dart'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format M3.2 review candidate"
          git push origin HEAD:feat/m3-2a-live-auth-readonly
