name: M3.2 one-shot snapshot-only room autofix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m32-snapshot-only-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.ref == 'refs/heads/feat/m3-2a-live-auth-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/m3-2a-live-auth-readonly
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Apply and verify correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tool/review/apply_snapshot_only_fix.py
          dart format \
            lib/features/room/application/room_controller.dart \
            lib/features/room/presentation/room_page.dart
          flutter pub get --enforce-lockfile
          flutter analyze

      - name: Commit only the corrected product files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/features/room/application/room_controller.dart \
            lib/features/room/presentation/room_page.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(room): keep HTTP snapshot mode transport-free"
          git push origin HEAD:feat/m3-2a-live-auth-readonly
