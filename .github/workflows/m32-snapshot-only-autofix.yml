name: M3.2 one-shot snapshot-only room autofix

on:
  push:
    branches:
      - feat/m3-2a-live-auth-readonly
    paths:
      - tool/review/apply_snapshot_only_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/m3-2a-live-auth-readonly
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Apply and verify correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tool/review/apply_snapshot_only_fix.py
          dart format \
            lib/features/room/application/room_controller.dart \
            lib/features/room/presentation/room_page.dart
          flutter pub get --enforce-lockfile
          flutter analyze

      - name: Commit only the corrected product files
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/features/room/application/room_controller.dart \
            lib/features/room/presentation/room_page.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(room): keep HTTP snapshot mode transport-free"
          git push origin HEAD:feat/m3-2a-live-auth-readonly
