name: M3.2 one-shot emulator shell autofix

on:
  push:
    branches:
      - feat/m3-2a-live-auth-readonly
    paths:
      - tool/review/apply_snapshot_only_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/m3-2a-live-auth-readonly
          fetch-depth: 0

      - name: Apply emulator shell compatibility correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tool/review/apply_snapshot_only_fix.py

      - name: Commit only the reviewed workflow correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/m32-pre-provider-review.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(m3.2a): use POSIX shell flags in emulator runner"
          git push origin HEAD:feat/m3-2a-live-auth-readonly
