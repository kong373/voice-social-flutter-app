name: M3.2 one-shot hygiene marker autofix

on:
  push:
    branches:
      - feat/m3-2a-live-auth-readonly
    paths:
      - tool/review/apply_snapshot_only_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/m3-2a-live-auth-readonly
          fetch-depth: 0

      - name: Remove static secret-like QA markers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tool/review/apply_snapshot_only_fix.py
          bash -n tool/qa/run_m32_vendor_avd.sh

      - name: Commit hygiene-only changes
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/flutter-ci.yml \
            tool/qa/run_m32_vendor_avd.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(m3.2a): remove static secret-like QA markers"
          git push origin HEAD:feat/m3-2a-live-auth-readonly
