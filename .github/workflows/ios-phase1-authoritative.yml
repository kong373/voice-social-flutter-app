name: iOS Phase 1 Authoritative

on:
  push:
    branches: [codex/m5-ios-client]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.7"
  REQUIRED_BASE_SHA: "6b6e35fc03c08431b2c2d6b0147daccd8307c5b9"

jobs:
  prepare:
    name: Prepare immutable iOS source candidate
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.candidate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/m5-ios-client
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify base
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "$REQUIRED_BASE_SHA" HEAD
          if git diff --name-only "$REQUIRED_BASE_SHA" HEAD | grep -E '^(android/|packages/.+/android/)'; then
            exit 1
          fi
      - name: Ensure iOS host
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f ios/Runner.xcodeproj/project.pbxproj ]]; then
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            flutter create --platforms=ios --org=com.kong373 \
              --project-name=voice_social_app --no-pub "$tmp/voice_social_app"
            rm -rf ios
            cp -R "$tmp/voice_social_app/ios" ios
          fi
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re
          root=Path('.')
          p=root/'.gitignore'; s=p.read_text(); p.write_text(re.sub(r'(?m)^ios/\n','',s))
          p=root/'ios/Podfile'; s=p.read_text()
          s=re.sub(r'(?m)^#?\s*platform\s+:ios,\s*[\'\"][^\'\"]+[\'\"]\s*$',"platform :ios, '13.0'",s,count=1)
          if "platform :ios, '13.0'" not in s: s="platform :ios, '13.0'\n\n"+s
          marker='    flutter_additional_ios_build_settings(target)\n'
          if "config.build_settings['IPHONEOS_DEPLOYMENT_TARGET']" not in s:
              s=s.replace(marker,marker+"    target.build_configurations.each do |config|\n      config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '13.0'\n    end\n")
          p.write_text(s)
          p=root/'ios/Runner.xcodeproj/project.pbxproj'; s=p.read_text()
          s=re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;','PRODUCT_BUNDLE_IDENTIFIER = com.kong373.voiceSocialApp;',s)
          s=re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;','IPHONEOS_DEPLOYMENT_TARGET = 13.0;',s)
          s=re.sub(r'(?m)^\s*DEVELOPMENT_TEAM = .*;\n','',s)
          if 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;' not in s:
              s=s.replace('INFOPLIST_FILE = Runner/Info.plist;','CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;\n\t\t\t\tINFOPLIST_FILE = Runner/Info.plist;')
          p.write_text(s)
          p=root/'ios/Runner/Info.plist'
          with p.open('rb') as f: info=plistlib.load(f)
          info.update({
            'CFBundleDisplayName':'Voice-Social','CFBundleName':'Voice-Social',
            'NSMicrophoneUsageDescription':'Voice-Social 需要使用麦克风，以便你在语音房上麦和交流。',
            'NSPhotoLibraryUsageDescription':'Voice-Social 需要访问照片，以便你选择头像、动态图片和举报或反馈凭证。',
            'NSCameraUsageDescription':'Voice-Social 需要使用相机，以便你拍摄头像、动态图片和举报或反馈凭证。',
            'VoiceSocialNotificationPermissionPurpose':'Voice-Social 会在你允许后发送消息、互动和房间状态通知。',
            'UISupportedInterfaceOrientations':['UIInterfaceOrientationPortrait'],
            'UISupportedInterfaceOrientations~ipad':['UIInterfaceOrientationPortrait','UIInterfaceOrientationPortraitUpsideDown'],
          })
          info.pop('CFBundleURLTypes',None); info.pop('NSAppTransportSecurity',None)
          with p.open('wb') as f: plistlib.dump(info,f,sort_keys=False)
          (root/'ios/Runner/Runner.entitlements').write_text('<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n</dict>\n</plist>\n')
          (root/'docs/ios').mkdir(parents=True,exist_ok=True)
          (root/'docs/ios/phase1-runner.md').write_text('''# Voice-Social iOS Phase 1 Runner

## Implemented in source

- Flutter 3.44.7 UIScene-based Runner with iOS 13.0 deployment target.
- Generated plugin registration for first-party permissions, Agora RTC, Tencent IM and secure storage.
- Product-specific microphone, photo-library and camera purpose text.
- App-owned notification rationale; iOS has no standard notification usage-description plist key.
- Empty entitlements: APNs and Universal Links are intentionally absent.
- Android-only Alipay remains unsupported/fail-closed on iOS; Apple IAP is not fabricated.

## Unregistered development placeholder

`com.kong373.voiceSocialApp` is an unregistered development placeholder. No Apple Team ID, registered Bundle ID or provisioning profile is committed or claimed.

## Pending physical-device acceptance

- Confirm registered Bundle ID and Apple Team, then provision and sign a physical-device build.
- Validate permission prompts, Agora audio lifecycle and Tencent IM login/C2C/AVChatRoom on physical iPhones.
- Decide APNs scope and supply an approved Associated Domains/AASA contract before enabling either capability.

## Explicit exemptions

- Chuanglan delivery receipts: **EXEMPT**, not completed.
- Alipay asynchronous callback: **EXEMPT**, not completed.
- Alipay refund: **EXEMPT**, not completed.
''')
          PY
          cat > test/ios_phase1_runner_contract_test.dart <<'DART'
          import 'dart:io';
          import 'package:flutter_test/flutter_test.dart';
          void main() {
            String read(String p) => File(p).readAsStringSync();
            test('complete iOS 13 Runner host', () {
              for (final p in <String>[
                'ios/Podfile','ios/Flutter/AppFrameworkInfo.plist','ios/Flutter/Debug.xcconfig','ios/Flutter/Release.xcconfig',
                'ios/Runner.xcodeproj/project.pbxproj','ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme',
                'ios/Runner.xcworkspace/contents.xcworkspacedata','ios/Runner/AppDelegate.swift','ios/Runner/SceneDelegate.swift',
                'ios/Runner/Info.plist','ios/Runner/Runner.entitlements','ios/Runner/Base.lproj/Main.storyboard',
                'ios/Runner/Base.lproj/LaunchScreen.storyboard','ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json',
                'ios/RunnerTests/RunnerTests.swift']) {
                expect(File(p).existsSync(), isTrue, reason: p);
              }
              expect(read('ios/Podfile'), contains("platform :ios, '13.0'"));
              expect(read('ios/Runner.xcodeproj/project.pbxproj'), contains('IPHONEOS_DEPLOYMENT_TARGET = 13.0;'));
            });
            test('placeholder and provider boundaries are explicit', () {
              final project=read('ios/Runner.xcodeproj/project.pbxproj');
              final info=read('ios/Runner/Info.plist');
              final entitlements=read('ios/Runner/Runner.entitlements');
              final alipay=read('packages/alipay_app_pay/pubspec.yaml');
              expect(project, contains('com.kong373.voiceSocialApp'));
              expect(project, isNot(contains('DEVELOPMENT_TEAM =')));
              for (final key in ['NSMicrophoneUsageDescription','NSPhotoLibraryUsageDescription','NSCameraUsageDescription','VoiceSocialNotificationPermissionPurpose']) { expect(info, contains(key)); }
              expect(info, contains('语音房上麦和交流'));
              expect(info, contains('选择头像、动态图片和举报或反馈凭证'));
              expect(info, contains('拍摄头像、动态图片和举报或反馈凭证'));
              expect(info, contains('消息、互动和房间状态通知'));
              expect(entitlements, isNot(contains('aps-environment')));
              expect(entitlements, isNot(contains('com.apple.developer.associated-domains')));
              expect(info, isNot(contains('CFBundleURLTypes')));
              expect(info, isNot(contains('NSAllowsArbitraryLoads')));
              expect(alipay, contains('android:'));
              expect(alipay, isNot(contains(RegExp(r'^\s+ios:', multiLine:true))));
              expect(Directory('packages/alipay_app_pay/ios').existsSync(), isFalse);
              expect(read('pubspec.yaml'), isNot(contains('in_app_purchase')));
            });
            test('plugins use standard registration', () {
              expect(read('ios/Runner/AppDelegate.swift'), contains('GeneratedPluginRegistrant.register'));
              expect(read('ios/Podfile'), contains('flutter_install_all_ios_pods'));
            });
          }
          DART
          dart format test/ios_phase1_runner_contract_test.dart
          flutter pub get --enforce-lockfile
          (cd ios && pod install)
      - name: Commit source candidate
        id: candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'Voice Social iOS Automation'
          git config user.email 'ios-automation@users.noreply.github.com'
          git add -A -- .gitignore ios docs/ios test/ios_phase1_runner_contract_test.dart
          if git diff --cached --name-only | grep -E '^(android/|packages/.+/android/)'; then exit 1; fi
          if ! git diff --cached --quiet; then
            git commit -m 'feat(ios): add iOS 13 Runner and fail-closed vendor host'
            git push origin HEAD:codex/m5-ios-client
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: Linux format, analyze and complete Flutter tests
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed test/ios_phase1_runner_contract_test.dart
      - run: flutter analyze
      - run: flutter test --concurrency=1 --timeout=90s --reporter=expanded

  ios-simulator:
    name: macOS CocoaPods and iOS Simulator build
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version
      - run: flutter pub get --enforce-lockfile
      - run: cd ios && pod install
      - run: flutter test test/ios_phase1_runner_contract_test.dart --reporter=expanded
      - name: Validate linked iOS pods and forbidden payment providers
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Eqi 'agora' ios/Podfile.lock
          grep -Eqi 'tencent|tim' ios/Podfile.lock
          grep -Eqi 'first_party_native_permissions' ios/Podfile.lock
          grep -Eqi 'flutter_secure_storage' ios/Podfile.lock
          if grep -Eqi 'alipay|in_app_purchase|storekit' ios/Podfile.lock; then exit 1; fi
      - name: Build simulator
        run: >-
          flutter build ios --simulator --debug
          --dart-define=BACKEND_MODE=live
          --dart-define=APP_ENV=development
          --dart-define=ALLOW_INSECURE_HTTP=true
          --dart-define=API_BASE_URL=http://127.0.0.1:18080/
          --dart-define=CLIENT_TYPE=iOS
          --dart-define=CLIENT_INNER_VERSION=6
          --dart-define=OAUTH_CLIENT_ID=voice-social-mobile-public
          --dart-define=ENABLE_AGORA_RTC=false
          --dart-define=ENABLE_TENCENT_IM=false
          --dart-define=ENABLE_ALIPAY_APP_PAY=false

  record:
    name: Record authoritative Phase 1 verdict
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, quality, ios-simulator]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/m5-ios-client
          fetch-depth: 0
      - name: Record and push
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          IOS_RESULT: ${{ needs.ios-simulator.result }}
        run: |
          set -Eeuo pipefail
          verdict=PASS
          [[ "$QUALITY_RESULT" == success && "$IOS_RESULT" == success ]] || verdict=BLOCKED
          mkdir -p docs/ios
          cat > docs/ios/phase1-status.json <<EOF
          {
            "status": "$verdict",
            "base_sha": "$REQUIRED_BASE_SHA",
            "source_sha": "$SOURCE_SHA",
            "workflow_run_id": "${{ github.run_id }}",
            "linux_format_analyze_flutter_tests": "$QUALITY_RESULT",
            "macos_pods_ios_simulator_build": "$IOS_RESULT",
            "physical_device_verified": false,
            "release_signing_verified": false,
            "bundle_id": "com.kong373.voiceSocialApp",
            "bundle_id_status": "UNREGISTERED_DEVELOPMENT_PLACEHOLDER",
            "apns": "NOT_CONFIGURED",
            "universal_links": "NOT_CONFIGURED",
            "alipay_ios": "UNSUPPORTED_FAIL_CLOSED",
            "apple_iap": "NOT_IMPLEMENTED",
            "chuanglan_delivery_receipt": "EXEMPT_NOT_COMPLETED",
            "alipay_async_callback": "EXEMPT_NOT_COMPLETED",
            "alipay_refund": "EXEMPT_NOT_COMPLETED"
          }
          EOF
          rm -f .github/workflows/ios-phase1-bootstrap.yml
          rm -f .github/workflows/ios-phase1-finalize.yml
          rm -f .github/workflows/ios-phase1-reconcile.yml
          rm -f .github/workflows/ios-phase1-authoritative.yml
          git config user.name 'Voice Social iOS Automation'
          git config user.email 'ios-automation@users.noreply.github.com'
          git add -A -- docs/ios .github/workflows
          git commit -m "test(ios): record authoritative Phase 1 $verdict"
          git push origin HEAD:codex/m5-ios-client
          if [[ "$verdict" != PASS ]]; then exit 1; fi
