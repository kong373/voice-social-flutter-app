name: M3.3 one-shot responsive home mosaic

on:
  pull_request:
    types: [synchronize, opened, reopened]

permissions:
  contents: write

jobs:
  repair-responsive-mosaic:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/m3-3-video-runtime-ui' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: 3.44.7
      TARGET_BRANCH: feat/m3-3-video-runtime-ui
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Make the hero mosaic responsive at large text scales
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/shell/video_runtime_pages.dart')
          text = path.read_text(encoding='utf-8')
          old = '''  Widget _heroMosaic() {\n    final DiscoveryRoom? room = _rooms.isEmpty ? null : _rooms.first;\n    return SizedBox(\n      height: 202,'''
          new = '''  Widget _heroMosaic() {\n    final DiscoveryRoom? room = _rooms.isEmpty ? null : _rooms.first;\n    final double textScale = MediaQuery.textScalerOf(context).scale(1);\n    final double mosaicHeight = (202 + (textScale - 1) * 190).clamp(\n      202.0,\n      268.0,\n    );\n    return SizedBox(\n      height: mosaicHeight,'''
          if old not in text:
              if 'final double mosaicHeight' not in text:
                  raise SystemExit('Expected fixed hero mosaic was not found')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          dart format lib/features/shell/video_runtime_pages.dart
          rm -f .github/workflows/m33-one-shot-responsive-mosaic.yml

      - name: Verify responsive runtime surface
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test test/video_runtime_ui_test.dart \
            --reporter=expanded \
            --timeout=120s

      - name: Commit verified responsive layout
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ui): reflow home mosaic for large text'
          git push origin "HEAD:$TARGET_BRANCH"
