name: M3.2A one-shot source formatter

on:
  push:
    branches:
      - feat/m3-2a-live-auth-readonly

permissions:
  contents: write

concurrency:
  group: m32a-format-fix-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  format:
    if: github.event.head_commit.message != 'chore(format): apply Dart 3.44.7 formatter'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: feat/m3-2a-live-auth-readonly
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Apply canonical formatter
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter pub get --enforce-lockfile
          mapfile -d '' dart_files < <(
            find lib test integration_test tool -type f -name '*.dart' -print0 | sort -z
          )
          test "${#dart_files[@]}" -gt 0
          dart format "${dart_files[@]}"
          if git diff --quiet -- "${dart_files[@]}"; then
            echo "No formatting changes are required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${dart_files[@]}"
          git commit -m "chore(format): apply Dart 3.44.7 formatter"
          git push origin HEAD:feat/m3-2a-live-auth-readonly
