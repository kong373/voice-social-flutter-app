name: M3.3 finalize video-runtime candidate

on:
  push:
    branches:
      - feat/m3-3-video-runtime-ui
    paths:
      - '.github/workflows/m33-finalize-video-runtime-candidate.yml'

permissions:
  contents: write

concurrency:
  group: m33-finalize-video-runtime-candidate
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m3-3-video-runtime-ui
          fetch-depth: 0

      - name: Let earlier one-shot writers settle and refresh branch
        shell: bash
        run: |
          set -Eeuo pipefail
          sleep 120
          git fetch origin feat/m3-3-video-runtime-ui
          git reset --hard origin/feat/m3-3-video-runtime-ui

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Apply idempotent room-session corrections and remove obsolete helpers
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/features/room/presentation/video_runtime_room_page.dart')
          text = p.read_text()

          if 'bool _allowPop = false;' not in text:
              text = text.replace(
                  '  bool _showGiftCelebration = false;\n  bool _ending = false;\n',
                  '  bool _showGiftCelebration = false;\n  bool _ending = false;\n  bool _allowPop = false;\n',
              )
          text = text.replace('        canPop: false,', '        canPop: _allowPop,')
          text = text.replace(
              "                  onPressed: () => Navigator.of(context).pop(VideoRoomExit.ended),",
              "                  onPressed: () => _popRoom(VideoRoomExit.ended),",
          )

          old_init = '''    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (mounted) {
        _controller.join();
      }
    });'''
          new_init = '''    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (!mounted) {
        return;
      }
      if (_controller.status == RoomSessionStatus.idle ||
          _controller.status == RoomSessionStatus.failed) {
        _controller.join();
      }
    });'''
          text = text.replace(old_init, new_init)

          if 'void _popRoom(VideoRoomExit result)' not in text:
              text = text.replace(
                  '''  void _minimize() {
    if (widget.allowMinimize) {
      Navigator.of(context).pop(VideoRoomExit.minimized);
    }
  }
''',
                  '''  void _minimize() {
    if (widget.allowMinimize) {
      _popRoom(VideoRoomExit.minimized);
    }
  }

  void _popRoom(VideoRoomExit result) {
    if (_allowPop || !mounted) {
      return;
    }
    setState(() => _allowPop = true);
    WidgetsBinding.instance.addPostFrameCallback((_) {
      if (mounted) {
        Navigator.of(context).pop(result);
      }
    });
  }
''',
              )
          text = text.replace(
              '    Navigator.of(context).pop(VideoRoomExit.ended);\n  }\n}\n\nclass _VideoRoomBackground',
              '    _popRoom(VideoRoomExit.ended);\n  }\n}\n\nclass _VideoRoomBackground',
          )

          switch_pattern = re.compile(
              r"          switch \(action\) \{.*?\n          \}",
              re.S,
          )
          replacement = '''          switch (action) {
            case 'members':
              _openMembers();
              break;
            case 'share':
              _openShare();
              break;
            case 'topic':
              _openTopic();
              break;
            case 'audio':
              _openAudio();
              break;
            case 'recovery':
              _openRecovery();
              break;
            case 'diagnostics':
              _openDiagnostics();
              break;
            case 'pk':
              _openPk();
              break;
            case 'report':
              _openReport();
              break;
            case 'copy':
              Clipboard.setData(ClipboardData(text: _controller.roomCode));
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('房间号已复制')),
              );
              break;
            case 'minimize':
              _minimize();
              break;
            case 'leaveMic':
              _controller.leaveMic();
              break;
            case 'leaveRoom':
              _confirmEnd();
              break;
          }'''
          text, count = switch_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('room tool switch was not found exactly once')

          p.write_text(text)

          for obsolete in (
              '.github/workflows/m33-video-runtime-ui.yml',
              '.github/workflows/m33-video-runtime-ui-v2.yml',
              '.github/workflows/m33-video-runtime-autofix.yml',
              '.github/workflows/m33-video-runtime-dart-fix.yml',
              '.github/workflows/m33-video-runtime-surgical-fix.yml',
              '.github/workflows/m33-video-runtime-restore-guard.yml',
          ):
              Path(obsolete).unlink(missing_ok=True)

          marker = Path('lib/core/design_system/video_runtime_candidate.dart')
          marker.write_text(
              "const String videoRuntimeUiContract = 'light-lobby+immersive-room+persistent-session';\n"
              "const bool videoRuntimeProviderCallsEnabled = false;\n"
          )
          PY

      - name: Resolve dependencies and apply safe analyzer fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter pub get --enforce-lockfile
          dart fix --apply
          dart format \
            lib/core/design_system/app_theme.dart \
            lib/core/design_system/runtime_surfaces.dart \
            lib/core/design_system/video_runtime_candidate.dart \
            lib/app/app.dart \
            lib/features/shell/main_shell.dart \
            lib/features/shell/video_runtime_pages.dart \
            lib/features/room/presentation/video_runtime_room_page.dart \
            test/video_runtime_ui_test.dart \
            integration_test/m3_3_video_runtime_ui_test.dart

      - name: Validate analyzer and targeted runtime tests before publishing candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter analyze
          flutter test test/video_runtime_ui_test.dart --reporter=expanded --timeout=120s

      - name: Commit finalized candidate and helper cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No candidate changes were required.'
            exit 0
          fi
          git commit -m 'fix(ui): finalize video-runtime interaction candidate'
          for attempt in 1 2 3; do
            if git push origin HEAD:feat/m3-3-video-runtime-ui; then
              exit 0
            fi
            git pull --rebase origin feat/m3-3-video-runtime-ui
          done
          exit 1
