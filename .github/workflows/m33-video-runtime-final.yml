name: M3.3 video-runtime UI final acceptance

on:
  push:
    branches:
      - feat/m3-3-video-runtime-ui
    paths:
      - 'lib/**'
      - 'test/**'
      - 'integration_test/m3_3_video_runtime_ui_test.dart'
      - '.github/workflows/m33-video-runtime-final.yml'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m33-video-runtime-final-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.7'
  JAVA_VERSION: '17'
  UI_BASE_SHA: '9fa9466e3049d963c199b0f8ea0b3e4b0e49f65f'

jobs:
  quality:
    name: Candidate format, analyze, tests and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check candidate formatting
        shell: bash
        run: |
          set -Eeuo pipefail
          git cat-file -e "${UI_BASE_SHA}^{commit}"
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR "$UI_BASE_SHA" HEAD -- '*.dart'
          )
          printf 'candidate_dart_files=%s\n' "${#files[@]}"
          if (( ${#files[@]} > 0 )); then
            dart format --output=none --set-exit-if-changed "${files[@]}"
          fi
      - name: Analyze
        run: flutter analyze
      - name: Run all Dart and widget tests
        run: flutter test --concurrency=1 --timeout=90s --reporter=expanded
      - name: Build Android debug APK
        run: >-
          flutter build apk --debug
          --dart-define=BACKEND_MODE=mock
          --dart-define=ENABLE_VIDEO_RUNTIME_DEMO=true
      - name: Verify page denominator, roots, forbidden entries and secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(grep -c "PageManifestEntry(" lib/app/page_manifest.dart)" -eq 69
          grep -F "label: '首页'" lib/features/shell/main_shell.dart
          grep -F "label: '发现'" lib/features/shell/main_shell.dart
          grep -F "label: '消息'" lib/features/shell/main_shell.dart
          grep -F "label: '我的'" lib/features/shell/main_shell.dart
          ! grep -RInE \
            '(红包|KTV|点歌|演唱|合唱|盲盒|魔法球|团子|情书|随机遇见|附近的人)' \
            lib/core/design_system/runtime_surfaces.dart \
            lib/features/shell/main_shell.dart \
            lib/features/shell/video_runtime_pages.dart \
            lib/features/room/presentation/video_runtime_room_page.dart
          ! grep -RInE \
            '(M3_OAUTH_CLIENT_SECRET|OAUTH_CLIENT_SECRET|RTC_APP_CERTIFICATE|IM_ADMIN_SECRET|PAYMENT_PRIVATE_KEY|BEGIN (RSA |EC )?PRIVATE KEY)' \
            lib android ios
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m33-final-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            pubspec.lock
          if-no-files-found: warn
          retention-days: 14

  avd:
    name: ${{ matrix.id }} API ${{ matrix.api }} ${{ matrix.viewport }}
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: AVD-A
            api: 36
            profile: pixel_7_pro
            viewport: 390x844
            width: 390
            height: 844
            physical: 1170x2532
            density: 480
            dpr: '3'
          - id: AVD-B
            api: 35
            profile: pixel_2
            viewport: 360x800
            width: 360
            height: 800
            physical: 900x2000
            density: 400
            dpr: '2.5'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Require KVM
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
      - name: Run exact-viewport interaction acceptance
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          EVIDENCE_ROOT: ${{ github.workspace }}/artifacts/m3.3/${{ matrix.id }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6144M
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: false
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-snapshot
            -wipe-data
            -no-metrics
            -camera-back none
            -camera-front none
          script: |
            set -Eeuo pipefail
            mkdir -p "$EVIDENCE_ROOT/screenshots"
            adb shell wm size ${{ matrix.physical }}
            adb shell wm density ${{ matrix.density }}
            adb shell settings put system font_scale 1.0
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb logcat -c
            adb logcat -v threadtime >"$EVIDENCE_ROOT/logcat.txt" &
            logcat_pid=$!
            trap 'kill "$logcat_pid" 2>/dev/null || true' EXIT
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/m3_3_video_runtime_ui_test.dart \
              -d emulator-5554 \
              --dart-define=BACKEND_MODE=mock \
              --dart-define=ENABLE_VIDEO_RUNTIME_DEMO=true \
              --dart-define=QA_AVD_ID=${{ matrix.id }} \
              --dart-define=QA_EXPECTED_VIEWPORT_WIDTH=${{ matrix.width }} \
              --dart-define=QA_EXPECTED_VIEWPORT_HEIGHT=${{ matrix.height }} \
              --dart-define=QA_EXPECTED_DPR=${{ matrix.dpr }} \
              2>&1 | tee "$EVIDENCE_ROOT/flutter-drive.log"
            find . -type f -name 'm33-*.png' -print -exec cp {} "$EVIDENCE_ROOT/screenshots/" \;
            screenshots="$(find "$EVIDENCE_ROOT/screenshots" -type f -name '*.png' | wc -l | tr -d ' ')"
            hard_errors="$(grep -Eci 'FATAL EXCEPTION|AndroidRuntime|ANR in|MissingPluginException|RenderFlex overflow|Unhandled Exception' "$EVIDENCE_ROOT/logcat.txt" || true)"
            {
              echo "conclusion=PASS"
              echo "run_id=${{ github.run_id }}"
              echo "run_attempt=${{ github.run_attempt }}"
              echo "git_sha=${{ github.sha }}"
              echo "avd=${{ matrix.id }}"
              echo "api=${{ matrix.api }}"
              echo "viewport=${{ matrix.viewport }}"
              echo "dpr=${{ matrix.dpr }}"
              echo "screenshots=$screenshots"
              echo "hard_errors=$hard_errors"
              echo "provider_calls_made=false"
            } | tee "$EVIDENCE_ROOT/summary.txt"
            test "$screenshots" -ge 8
            test "$hard_errors" -eq 0
      - name: Upload AVD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m33-final-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/m3.3/${{ matrix.id }}/
          if-no-files-found: warn
          retention-days: 30

  verdict:
    name: Strict two-AVD verdict
    needs: [quality, avd]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: m33-final-AVD-*
          path: evidence
          merge-multiple: false
      - name: Verify both exact-viewport runs
        shell: bash
        env:
          QUALITY: ${{ needs.quality.result }}
          AVD: ${{ needs.avd.result }}
        run: |
          set -Eeuo pipefail
          test "$QUALITY" = success
          test "$AVD" = success
          mapfile -t summaries < <(find evidence -type f -name summary.txt | sort)
          test "${#summaries[@]}" -eq 2
          grep -R '^avd=AVD-A$' evidence
          grep -R '^avd=AVD-B$' evidence
          grep -R '^viewport=390x844$' evidence
          grep -R '^viewport=360x800$' evidence
          test "$(grep -R '^conclusion=PASS$' evidence | wc -l | tr -d ' ')" -eq 2
          test "$(grep -R '^hard_errors=0$' evidence | wc -l | tr -d ' ')" -eq 2
          test "$(grep -R '^provider_calls_made=false$' evidence | wc -l | tr -d ' ')" -eq 2
          {
            echo "tested_git_sha=${{ github.sha }}"
            echo "quality=$QUALITY"
            echo "avd_matrix=$AVD"
            echo "conclusion=VIDEO_RUNTIME_UI_PASS"
          } | tee aggregate-verdict.txt
      - name: Upload aggregate verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m33-final-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: aggregate-verdict.txt
          if-no-files-found: error
          retention-days: 30
