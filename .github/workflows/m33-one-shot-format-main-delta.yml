name: M3.3 one-shot formatter against main

on:
  push:
    branches:
      - feat/m3-3-video-runtime-ui

permissions:
  contents: write

jobs:
  format-main-delta:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLUTTER_VERSION: 3.44.7
      TARGET_BRANCH: feat/m3-3-video-runtime-ui
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Format every Dart file changed from main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main:refs/remotes/origin/main
          base_sha="$(git merge-base HEAD origin/main)"
          mapfile -d '' dart_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "$base_sha" HEAD -- '*.dart'
          )
          printf 'format_base=%s\n' "$base_sha"
          printf 'format_head=%s\n' "$(git rev-parse HEAD)"
          printf 'candidate_dart_files=%s\n' "${#dart_files[@]}"
          if (( ${#dart_files[@]} > 0 )); then
            dart format "${dart_files[@]}"
          fi
          rm -f .github/workflows/m33-one-shot-format-main-delta.yml

      - name: Commit formatted candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git commit -m 'style(ui): format complete M3.3 candidate against main'
          git push origin "HEAD:$TARGET_BRANCH"
