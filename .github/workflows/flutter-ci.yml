name: Flutter CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  quality:
    name: Static, unit, widget, integration-source, and public-client hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java 21 for Android helper contracts
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Flutter version
        run: flutter --version

      - name: Verify locked dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f pubspec.lock
          flutter pub get --enforce-lockfile

      - name: Check candidate formatting without mutating the checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          base_sha="$(git merge-base HEAD origin/main)"
          mapfile -d '' dart_files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "$base_sha" HEAD -- '*.dart'
          )
          {
            printf 'format_base=%s\n' "$base_sha"
            printf 'format_head=%s\n' "$(git rev-parse HEAD)"
            printf 'changed_dart_files=%s\n' "${#dart_files[@]}"
            printf '%s\n' "${dart_files[@]}"
          } | tee format.log
          if (( ${#dart_files[@]} > 0 )); then
            dart format \
              --output=none \
              --set-exit-if-changed \
              "${dart_files[@]}" 2>&1 | tee -a format.log
          fi

      - name: Verify mobile public-client secret hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ci-evidence
          if grep -RInF 'OAUTH_CLIENT_SECRET' lib integration_test; then
            echo 'OAUTH_CLIENT_SECRET must not be read by the mobile app.' >&2
            exit 1
          fi
          if grep -RInF 'Client-Secret' lib integration_test; then
            echo 'Client-Secret must not be sent by the mobile app.' >&2
            exit 1
          fi
          if grep -RInF "'clientSecret'" lib integration_test || \
             grep -RInF '"clientSecret"' lib integration_test; then
            echo 'A clientSecret payload field exists in mobile source.' >&2
            exit 1
          fi
          if grep -RInE 'access-key-secret|app-certificate|secret-key|private-key|webhook-secret' lib integration_test; then
            echo 'Provider secret property leaked into the mobile source tree.' >&2
            exit 1
          fi
          if grep -RInE 'DEVELOPMENT_OUTBOX_KEY|X-Development-Outbox-Key|ci-local-outbox-placeholder' lib integration_test; then
            echo 'A confidential development outbox credential leaked into mobile source.' >&2
            exit 1
          fi
          {
            echo 'mobile_client_type=oauth_public_client'
            echo 'oauth_client_secret_loaded=false'
            echo 'provider_secrets_in_mobile=false'
            echo 'confidential_development_outbox_loaded=false'
          } | tee ci-evidence/public-client-hygiene.txt

      - name: Validate QA tooling syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile tool/qa/m32_contract_server.py
          bash -n tool/qa/run_m32_vendor_avd.sh

      - name: Analyze
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Run tests
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          flutter test \
            --coverage \
            --concurrency=1 \
            --timeout=60s \
            --reporter=expanded \
            2>&1 | tee test.log

      - name: Upload quality diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flutter-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            format.log
            analyze.log
            test.log
            test/failures/
            coverage/
            ci-evidence/
          if-no-files-found: warn
          retention-days: 14

  android-debug:
    name: Build live public-client Android debug APK
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate isolated Android runner
        run: >-
          flutter create
          --platforms=android
          --org=com.kong373
          --project-name=voice_social_app
          --no-pub
          .ci_app

      - name: Copy application sources
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf .ci_app/lib .ci_app/test .ci_app/integration_test .ci_app/packages
          cp -R lib .ci_app/lib
          cp -R test .ci_app/test
          cp -R integration_test .ci_app/integration_test
          cp -R packages .ci_app/packages
          cp pubspec.yaml pubspec.lock analysis_options.yaml .ci_app/
          mkdir -p .ci_app/tool
          cp tool/prepare_android_audio_manifest.py .ci_app/tool/
          python3 tool/prepare_android_audio_manifest.py .ci_app

      - name: Build live public-client debug APK
        working-directory: .ci_app
        shell: bash
        run: |
          set -Eeuo pipefail
          flutter pub get --enforce-lockfile
          flutter build apk --debug \
            --dart-define=BACKEND_MODE=live \
            --dart-define=APP_ENV=development \
            --dart-define=ALLOW_INSECURE_HTTP=true \
            --dart-define=ENABLE_AGORA_RTC=true \
            --dart-define=API_BASE_URL=http://10.0.2.2:8765/ \
            --dart-define=OAUTH_CLIENT_ID=voice-social-mobile-public

      - name: Inspect APK for forbidden secret markers
        working-directory: .ci_app
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf apk-inspection
          mkdir apk-inspection
          unzip -q build/app/outputs/flutter-apk/app-debug.apk -d apk-inspection
          if grep -aRInE 'OAUTH_CLIENT_SECRET|Client-Secret|DEVELOPMENT_OUTBOX_KEY|X-Development-Outbox-Key|ci-local-outbox-placeholder|actual-secret-value|do-not-expose-' apk-inspection; then
            echo 'Forbidden secret marker found in APK.' >&2
            exit 1
          fi
          sha256sum build/app/outputs/flutter-apk/app-debug.apk |
            tee build/app/outputs/flutter-apk/app-debug.apk.sha256

      - name: Upload live public-client debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voice-social-app-live-public-client-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci_app/build/app/outputs/flutter-apk/app-debug.apk
            .ci_app/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
