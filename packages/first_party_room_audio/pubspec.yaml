name: first_party_room_audio
description: Bounded native room audio lifecycle bridge, not an RTC engine.
version: 0.1.0
publish_to: none
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.kong373.first_party_room_audio
        pluginClass: FirstPartyRoomAudioPlugin
      ios:
        pluginClass: FirstPartyRoomAudioPlugin
